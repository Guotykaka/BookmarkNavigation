<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ergulum</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <script>
    if (localStorage.getItem('ergulum_theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Noto+Sans+SC:wght@400;500&family=Outfit:wght@700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #fff;
      --text: #202124;
      --text-2: #70757a;
      --border: #dfe1e5;
      --hover: #f1f3f4;
      --surface: #fff;
      --footer-bg: #f8f9fa;
      --footer-border: #e8eaed;
      --shadow: rgba(32, 33, 36, .28);
      --active-bg: #e8f0fe;
      --active-text: #1967d2;
      --dropdown-shadow: rgba(0, 0, 0, .2);
      --font-sans: "Manrope", "Noto Sans SC", sans-serif;
      --font-display: "Outfit", "Manrope", "Noto Sans SC", sans-serif;
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 14px;
      --fw: 400;
      --fw-med: 500;
      --fw-bold: 700;
      /* compat aliases */
      --muted: var(--text-2);
      --muted-2: var(--text-2);
    }

    html.dark {
      --bg: #202124;
      --text: #e8eaed;
      --text-2: #9aa0a6;
      --border: #5f6368;
      --hover: #303134;
      --surface: #303134;
      --footer-bg: #121212;
      --footer-border: #3c4043;
      --shadow: rgba(0, 0, 0, .5);
      --active-bg: #394457;
      --active-text: #8ab4f8;
      --dropdown-shadow: rgba(0, 0, 0, .5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--fs-md);
      font-weight: var(--fw);
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background .2s, color .2s;
      -webkit-font-smoothing: antialiased;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      font-size: var(--fs-sm);
      font-weight: var(--fw);
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .top-bar a {
      color: var(--text-2);
      text-decoration: none;
    }

    .top-bar a:hover {
      color: var(--text);
    }

    .theme-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
    }

    .theme-btn:hover {
      background: var(--hover);
      color: var(--text);
    }

    .theme-btn .icon-moon {
      display: none;
    }

    html.dark .theme-btn .icon-sun {
      display: none;
    }

    html.dark .theme-btn .icon-moon {
      display: block;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12vh;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 68px;
      font-weight: var(--fw-bold);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 26px;
      user-select: none;
    }

    .logo span:nth-child(1) {
      color: #4285f4;
    }

    .logo span:nth-child(2) {
      color: #ea4335;
    }

    .logo span:nth-child(3) {
      color: #fbbc05;
    }

    .logo span:nth-child(4) {
      color: #4285f4;
    }

    .logo span:nth-child(5) {
      color: #34a853;
    }

    .logo span:nth-child(6) {
      color: #ea4335;
    }

    .logo span:nth-child(7) {
      color: #4285f4;
    }

    .search-wrap {
      position: relative;
      width: min(560px, 90vw);
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 24px;
      height: 46px;
      padding: 0 8px 0 14px;
      transition: box-shadow .2s, background .2s, border-color .2s;
      background: var(--surface);
    }

    .search-box:hover,
    .search-box:focus-within {
      box-shadow: 0 1px 6px var(--shadow);
      border-color: transparent;
    }

    .engine-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 16px;
      font-size: var(--fs-sm);
      font-weight: var(--fw);
      color: var(--text-2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .engine-btn:hover {
      background: var(--hover);
      color: var(--text);
    }

    .engine-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: var(--fw-med);
      color: #fff;
      overflow: hidden;
      background: var(--hover);
      flex-shrink: 0;
    }

    .engine-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: var(--fs-md);
      font-family: inherit;
      font-weight: var(--fw);
      padding: 0 10px;
      height: 100%;
      background: transparent;
      color: var(--text);
    }

    .search-input::placeholder {
      color: var(--text-2);
      opacity: 1;
    }

    .search-submit {
      border: none;
      background: transparent;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .search-submit:hover {
      background: var(--hover);
    }

    .search-submit svg {
      fill: #4285f4;
    }

    .engine-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: 0 2px 10px var(--dropdown-shadow);
      padding: 8px 0;
      min-width: 180px;
      max-height: 320px;
      overflow-y: auto;
      display: none;
      z-index: 10;
    }

    .engine-dropdown.show {
      display: block;
    }

    .engine-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: var(--fs-md);
      font-weight: var(--fw);
      color: var(--text);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .engine-option:hover {
      background: var(--hover);
    }

    .engine-option.active {
      background: var(--active-bg);
      color: var(--active-text);
    }

    .nav-section {
      margin-top: 36px;
      width: min(720px, 94vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      padding: 4px;
      background: var(--hover);
      border-radius: 999px;
    }

    .nav-tab {
      border: none;
      background: transparent;
      color: var(--text-2);
      font-family: inherit;
      font-size: var(--fs-sm);
      font-weight: var(--fw);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1;
      transition: background .15s, color .15s;
    }

    .nav-tab:hover {
      color: var(--text);
    }

    .nav-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    }

    html.dark .nav-tab.active {
      background: #3c4043;
      box-shadow: none;
    }

    .nav-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 2px;
      width: 100%;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 84px;
      padding: 12px 4px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
    }

    .nav-item:hover {
      background: var(--hover);
    }

    .nav-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--hover);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: var(--fs-sm);
      font-weight: var(--fw-med);
      color: #fff;
      flex-shrink: 0;
    }

    .nav-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    html.dark .nav-icon:not(.initial) {
      background: #3c4043;
    }

    .nav-icon.initial {
      font-size: var(--fs-sm);
    }

    .nav-icon.initial.long {
      font-size: 11px;
    }

    .nav-name {
      font-size: var(--fs-sm);
      font-weight: var(--fw);
      text-align: center;
      max-width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      padding: 14px 32px;
      font-size: var(--fs-sm);
      font-weight: var(--fw);
      color: var(--text-2);
      border-top: 1px solid var(--footer-border);
      background: var(--footer-bg);
    }

    .footer-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .footer-brand .name {
      font-size: var(--fs-sm);
      font-weight: var(--fw-med);
      color: var(--text);
    }

    .footer-brand .note {
      font-size: var(--fs-xs);
      font-weight: var(--fw);
      color: var(--text-2);
    }

    .footer-meta {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-left: auto;
      font-size: var(--fs-sm);
      font-weight: var(--fw);
      color: var(--text-2);
    }

    .meta-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }

    .meta-value {
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      line-height: 1.35;
    }

    .meta-value.clock {
      font-variant-numeric: tabular-nums;
    }

    .meta-weather {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .meta-weather .temp,
    .meta-weather .city,
    .meta-weather .desc {
      color: var(--text-2);
    }

    .mu-panel {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 248px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: none;
      font-size: var(--fs-sm);
      font-weight: var(--fw);
    }

    .mu-panel>* {
      pointer-events: auto;
    }

    .mu-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
    }

    .mu-crest {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .mu-head-text {
      min-width: 0;
    }

    .mu-title {
      font-size: var(--fs-md);
      font-weight: var(--fw-med);
      color: var(--text);
      line-height: 1.25;
    }

    .mu-sub {
      font-size: var(--fs-xs);
      font-weight: var(--fw);
      color: var(--text-2);
      margin-top: 2px;
    }

    .mu-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 14px 12px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
    }

    .mu-label {
      font-size: var(--fs-xs);
      font-weight: var(--fw-med);
      color: var(--club-accent, #da291c);
      margin-bottom: 10px;
    }

    html.dark .mu-label {
      color: var(--club-accent-dark, #ff6b61);
    }

    .mu-club {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mu-club+.mu-club {
      margin-top: 6px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .mu-match {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mu-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 64px;
      min-width: 0;
    }

    .mu-team img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .mu-team span {
      font-size: var(--fs-xs);
      font-weight: var(--fw);
      text-align: center;
      color: var(--text);
      line-height: 1.25;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .mu-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    .mu-score {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: var(--fw-bold);
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1;
    }

    .mu-vs {
      font-size: var(--fs-sm);
      font-weight: var(--fw-med);
      color: var(--text-2);
    }

    .mu-meta {
      margin-top: 10px;
      font-size: var(--fs-xs);
      font-weight: var(--fw);
      color: var(--text-2);
      text-align: center;
      line-height: 1.45;
    }

    .mu-meta .venue {
      color: var(--text-2);
    }

    .mu-empty,
    .mu-loading {
      font-size: var(--fs-xs);
      color: var(--text-2);
      text-align: center;
      padding: 8px 0 2px;
    }

    .mu-link {
      display: block;
      text-decoration: none;
      color: inherit;
      transition: border-color .2s, background .2s;
    }

    .mu-link:hover {
      border-color: color-mix(in srgb, var(--club-accent, #da291c) 35%, transparent);
      background: var(--hover);
    }

    .mu-line {
      display: none;
    }

    @media (max-height: 820px) and (min-width: 1801px) {
      .mu-panel {
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        padding-right: 4px;
      }
    }

    @media (max-width: 1800px) {
      .top-bar {
        order: 0;
      }

      .mu-panel {
        order: 1;
        position: static;
        left: auto;
        top: auto;
        transform: none;
        width: 100%;
        z-index: 1;
        padding: 0 16px 8px;
        gap: 0;
        max-height: none;
        overflow: visible;
      }

      .main {
        order: 2;
      }

      .footer {
        order: 3;
      }

      .mu-club {
        gap: 2px;
        padding: 8px 0;
        align-items: center;
      }

      .mu-club+.mu-club {
        margin-top: 0;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }

      .mu-head {
        gap: 8px;
        padding: 0 0 4px;
        justify-content: center;
      }

      .mu-crest {
        width: 18px;
        height: 18px;
      }

      .mu-head-text {
        text-align: center;
      }

      .mu-title {
        font-size: var(--fs-xs);
        font-weight: var(--fw-med);
      }

      .mu-sub {
        display: none;
      }

      .mu-block {
        background: transparent;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 3px 0;
      }

      .mu-link:hover {
        background: transparent;
        border-color: transparent;
        opacity: .75;
      }

      .mu-label,
      .mu-match,
      .mu-meta,
      .mu-empty,
      .mu-loading {
        display: none;
      }

      .mu-line {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px 8px;
        font-size: var(--fs-xs);
        font-weight: var(--fw);
        color: var(--text);
        line-height: 1.35;
        min-width: 0;
        text-align: center;
      }

      .mu-line-tag {
        flex-shrink: 0;
        font-size: var(--fs-xs);
        font-weight: var(--fw-med);
        color: var(--club-accent, #da291c);
      }

      html.dark .mu-line-tag {
        color: var(--club-accent-dark, #ff6b61);
      }

      .mu-line img {
        width: 14px;
        height: 14px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .mu-line-name {
        max-width: 7.5em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mu-line-score,
      .mu-line-vs {
        font-family: var(--font-display);
        font-weight: var(--fw-bold);
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
      }

      .mu-line-score {
        font-size: var(--fs-sm);
      }

      .mu-line-vs {
        font-size: var(--fs-xs);
        color: var(--text-2);
      }

      .mu-line-meta {
        color: var(--text-2);
        font-size: var(--fs-xs);
        font-weight: var(--fw);
      }
    }

    @media (max-width: 800px) {
      .footer {
        padding: 12px 16px;
        gap: 12px;
      }

      .footer-brand {
        width: 100%;
      }

      .footer-meta {
        width: 100%;
        margin-left: 0;
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

        <div class="mu-loading">加载中…</div>
        <div class="mu-line"><span class="mu-line-tag">下场</span><span class="mu-line-meta">加载中…</span></div>
      </a>
    </div>
    <div class="mu-club" style="--club-accent:#dc052d;--club-accent-dark:#ff5a72">
      <div class="mu-head">

        <div class="mu-head-text">
          <div class="mu-title">Bayern Munich</div>

        <div class="mu-loading">加载中…</div>
        <div class="mu-line"><span class="mu-line-tag">下场</span><span class="mu-line-meta">加载中…</span></div>
      </a>
    </div>
  </aside>

  <header class="top-bar">
    <button type="button" class="theme-btn" id="themeBtn" title="切换深色模式" aria-label="切换深色模式">

    // —— 页脚网络时间（多源毫秒时间戳取中位数，东八区显示）——
    let netOffset = 0;
    let timeSynced = false;
    const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

    function networkNowMs() {
      return Date.now() + netOffset;
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function tickClock() {
      if (!timeSynced) return;
      const sh = new Date(networkNowMs() + 8 * 3600 * 1000);
      const y = sh.getUTCFullYear();
      const m = sh.getUTCMonth() + 1;
      const d = sh.getUTCDate();
      const w = WEEK[sh.getUTCDay()];
      $('clock').textContent = `${pad(sh.getUTCHours())}:${pad(sh.getUTCMinutes())}:${pad(sh.getUTCSeconds())}`;
      $('dateLine').textContent = `${y}年${m}月${d}日 星期${w}`;
    }

    function toMs(v) {
      const n = Number(v);
      if (!Number.isFinite(n) || n <= 0) throw new Error('bad ts');
      // 10 位秒级 → 毫秒
      return n < 1e12 ? Math.round(n * 1000) : Math.round(n);
    }

    async function probeTime(name, url, parse) {
      const t0 = Date.now();
      const res = await fetch(url, {cache: 'no-store', mode: 'cors'});
      const t1 = Date.now();
      if (!res.ok) throw new Error(name + '-http');
      const serverMs = toMs(await parse(res));
      const mid = Math.round((t0 + t1) / 2);
      return {name, offset: serverMs - mid, rtt: t1 - t0};
    }

    // 小米返回 `var servertime=…`，用 script 注入绕过 CORS
    function probeMiScript() {
      return new Promise((resolve, reject) => {
        const t0 = Date.now();
        const had = Object.prototype.hasOwnProperty.call(window, 'servertime');
        const prev = window.servertime;
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('mi-timeout'));
        }, 8000);

        function cleanup() {
          clearTimeout(timer);
          script.remove();
          if (had) window.servertime = prev;
          else delete window.servertime;
        }

        script.onload = () => {
          const t1 = Date.now();
          const v = window.servertime;
          cleanup();
          try {
            const serverMs = toMs(v);
            const mid = Math.round((t0 + t1) / 2);
            resolve({name: 'mi', offset: serverMs - mid, rtt: t1 - t0});
          } catch (err) {
            reject(err);
          }
        };
        script.onerror = () => {
          cleanup();
          reject(new Error('mi-load'));
        };
        script.src = `https://tptm.hd.mi.com/gettimestamp?_=${Date.now()}`;
        document.head.appendChild(script);
      });
    }

    async function syncNetworkTime() {
      $('clock').textContent = '--:--:--';
      $('dateLine').textContent = '正在同步网络时间…';

      // 仅用浏览器可跨域读取的源：
      // - 苏宁/拼多多等国内时间戳接口无 CORS，fetch 会失败
      // - maketimestamp 已 404
      // - timeapi.io 实测慢约 10 分钟，已剔除
      // - unixcalculator.com 在 file:// 与多数环境无 CORS，已剔除
      const jobs = [
        probeTime('cloudflare', 'https://www.cloudflare.com/cdn-cgi/trace', async res => {
          const txt = await res.text();
          const m = txt.match(/ts=([\d.]+)/);
          if (!m) throw new Error('cf-parse');
          return Number(m[1]) * 1000;
        }),
        probeMiScript(),
      ];

      const results = await Promise.allSettled(jobs);
      const ok = results
        .filter(r => r.status === 'fulfilled')
        .map(r => r.value)
        .sort((a, b) => a.offset - b.offset);

      if (!ok.length) {
        timeSynced = false;
        $('clock').textContent = '--:--:--';
        $('dateLine').textContent = '网络时间同步失败';
        console.warn('network time sync failed', results);
        return;
      }

      // 多源中位数，避免单个源漂移
      const mid = ok[Math.floor(ok.length / 2)].offset;
      netOffset = mid;
      timeSynced = true;
      tickClock();
      console.info('network time sources', ok.map(x => `${x.name}:${x.offset}ms/${x.rtt}ms`), 'use', mid);
    }

          reject(new Error('定位请求失败'));
        };
        script.src = `${url}${url.includes('?') ? '&' : '?'}output=jsonp&callback=${cb}`;
        document.head.appendChild(script);
      });
    }

    async function fetchWeather(loc) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lng}&current=temperature_2m,weather_code&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        const cur = data.current;
        const desc = WMO[cur.weather_code] || '未知';
        $('weatherLine').innerHTML = `
          <span class="city">${loc.address}</span>
          <span class="temp">${Math.round(cur.temperature_2m)}°</span>
          <span class="desc">${desc}</span>
        `;
      } catch {
        $('weatherLine').innerHTML = `<span class="city">${loc.address}</span><span class="desc">天气获取失败</span>`;
      }
    }

    function saveLoc(loc) {
      localStorage.setItem(LS_LOC, JSON.stringify(loc));
      return loc;
    }

    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=zh`
        );
        const data = await res.json();
        const parts = [data.principalSubdivision, data.city || data.locality]
          .filter(Boolean)
          .filter((v, i, arr) => arr.indexOf(v) === i);
        return parts.join('') || data.countryName || '当前位置';
      } catch {
        return '当前位置';
      }
    }

    async function locateByTencentIP() {
      const data = await jsonp(`https://apis.map.qq.com/ws/location/v1/ip?key=${QQ_MAP_KEY}`);
      if (data.status !== 0 || !data.result) {
        throw new Error(data.message || 'IP 定位失败');
      }
      const {location, ad_info: ad} = data.result;
      const address = [ad.province, ad.city, ad.district]
        .filter(Boolean)
        .filter((v, i, arr) => arr.indexOf(v) === i)
        .join('') || ad.nation || '未知地区';
      return saveLoc({
        lat: location.lat,
        lng: location.lng,
        address,
        ip: data.result.ip || '',
      });
    }

    function locateByBrowser() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('浏览器不支持定位'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          async pos => {
            try {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              const address = await reverseGeocode(lat, lng);
              resolve(saveLoc({lat, lng, address, ip: ''}));
            } catch (err) {
              reject(err);
            }
          },
          err => {
            const msg =
              err.code === 1 ? '已拒绝定位权限' :
                err.code === 2 ? '无法获取位置' :
                  err.code === 3 ? '定位超时' :
                    '浏览器定位失败';
            reject(new Error(msg));
          },
          {enableHighAccuracy: false, timeout: 12000, maximumAge: 600000}
        );
      });
    }

    async function resolveLocation() {
      $('weatherLine').innerHTML = `<span class="city">正在定位…</span>`;
      try {
        return await locateByTencentIP();
      } catch {
        $('weatherLine').innerHTML = `<span class="city">请求浏览器定位…</span>`;
        return locateByBrowser();
      }
    }

    async function initLocationWeather() {
      try {
        let loc = null;
        try {
          loc = JSON.parse(localStorage.getItem(LS_LOC) || 'null');
        } catch {loc = null;}

        if (!loc || loc.lat == null || loc.lng == null || !loc.address) {
          loc = await resolveLocation();
        }
        await fetchWeather(loc);
      } catch (err) {
        $('weatherLine').innerHTML = `<span class="desc">${err.message || '定位失败'}</span>`;
      }
    }

    initLocationWeather();

    // —— 足球赛况：曼联英超 + 拜仁德甲（ESPN 公开接口）——
    const ESPN_LOGO = id => `https://a.espncdn.com/i/teamlogos/soccer/500/${id}.png`;
    const CLUBS = [
      {
        id: '360',
        league: 'eng.1',
        lastId: 'muLast',
        nextId: 'muNext',
        fallbackLink: 'https://www.premierleague.com/en/clubs/1/Manchester-United/fixtures-results',
      },
      {
        id: '132',
        league: 'ger.1',
        lastId: 'fcbLast',
        nextId: 'fcbNext',
        fallbackLink: 'https://fcbayern.com/en/matches',
      },
    ];

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function scoreOf(c) {
      const s = c?.score;
      if (s == null) return null;
      if (typeof s === 'object') return s.displayValue ?? (s.value != null ? String(s.value) : null);
      return String(s);
    }

    function parseMatch(ev, fallbackLink) {
      const comp = ev.competitions?.[0];
      if (!comp) return null;
      const home = comp.competitors?.find(c => c.homeAway === 'home');
      const away = comp.competitors?.find(c => c.homeAway === 'away');
      if (!home || !away) return null;
      const state = comp.status?.type?.state || ev.status?.type?.state || '';
      const completed = !!(comp.status?.type?.completed || ev.status?.type?.completed);
      return {
        id: ev.id,
        date: new Date(comp.date || ev.date),
        state,
        finished: state === 'post' || completed,
        live: state === 'in',
        home: {
          id: home.team.id,
          name: home.team.shortDisplayName || home.team.displayName,
          logo: home.team.logo || ESPN_LOGO(home.team.id),
          score: scoreOf(home),
        },
        away: {
          id: away.team.id,
          name: away.team.shortDisplayName || away.team.displayName,
          logo: away.team.logo || ESPN_LOGO(away.team.id),
          score: scoreOf(away),
        },
        venue: comp.venue?.fullName || '',
        statusText: comp.status?.type?.shortDetail || ev.status?.type?.shortDetail || '',
        link: ev.links?.find(l => l.rel?.includes('summary'))?.href || fallbackLink,
      };
    }

    function fmtMatchDate(d) {
      if (!(d instanceof Date) || Number.isNaN(d.getTime())) return '—';
      const sh = new Date(d.getTime() + 8 * 3600 * 1000);
      const y = sh.getUTCFullYear();
      const m = sh.getUTCMonth() + 1;
      const day = sh.getUTCDate();
      const w = WEEK[sh.getUTCDay()];
      const hh = pad(sh.getUTCHours());
      const mm = pad(sh.getUTCMinutes());
      return `${y}/${m}/${day} 周${w} ${hh}:${mm}`;
    }

    function ymd(d) {
      return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}`;
    }

    function renderMatchBlock(el, match, mode) {
      const tag = mode === 'last' ? '上场' : '下场';
      const label = mode === 'last' ? '上场比分' : '下场预告';
      if (!match) {
        el.innerHTML = `
          <div class="mu-label">${label}</div>
          <div class="mu-empty">${mode === 'last' ? '暂无上场赛果' : '暂无下场赛程'}</div>
          <div class="mu-line"><span class="mu-line-tag">${tag}</span><span class="mu-line-meta">${mode === 'last' ? '暂无上场赛果' : '暂无下场赛程'}</span></div>
        `;
        return;
      }
      el.href = match.link;
      const scored = mode === 'last' || match.live;
      const center = scored
        ? `<div class="mu-score">${esc(match.home.score ?? '-')} : ${esc(match.away.score ?? '-')}</div>`
        : `<div class="mu-vs">VS</div>`;
      const note = mode === 'last'
        ? (match.statusText || 'FT')
        : (match.live ? (match.statusText || 'LIVE') : '未开赛');
      const lineMid = scored
        ? `<span class="mu-line-score">${esc(match.home.score ?? '-')} : ${esc(match.away.score ?? '-')}</span>`
        : `<span class="mu-line-vs">vs</span>`;
      el.innerHTML = `
        <div class="mu-label">${label}</div>
        <div class="mu-match">
          <div class="mu-team">
            <img src="${esc(match.home.logo)}" alt="" width="32" height="32" loading="lazy" />
            <span title="${esc(match.home.name)}">${esc(match.home.name)}</span>
          </div>
          <div class="mu-center">${center}</div>
          <div class="mu-team">
            <img src="${esc(match.away.logo)}" alt="" width="32" height="32" loading="lazy" />
            <span title="${esc(match.away.name)}">${esc(match.away.name)}</span>
          </div>
        </div>
        <div class="mu-meta">
          <div>${esc(fmtMatchDate(match.date))} · ${esc(note)}</div>
          ${match.venue ? `<div class="venue">${esc(match.venue)}</div>` : ''}
        </div>
        <div class="mu-line">
          <span class="mu-line-tag">${tag}</span>
          <img src="${esc(match.home.logo)}" alt="" width="14" height="14" loading="lazy" />
          <span class="mu-line-name" title="${esc(match.home.name)}">${esc(match.home.name)}</span>
          ${lineMid}
          <img src="${esc(match.away.logo)}" alt="" width="14" height="14" loading="lazy" />
          <span class="mu-line-name" title="${esc(match.away.name)}">${esc(match.away.name)}</span>
          <span class="mu-line-meta">${esc(fmtMatchDate(match.date))} · ${esc(note)}</span>
        </div>
      `;
    }

    async function fetchJson(url) {
      const res = await fetch(url, {cache: 'no-store'});
      if (!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }

    function clubApi(league) {
      return `https://site.api.espn.com/apis/site/v2/sports/soccer/${league}`;
    }

    async function fetchClubMatches(club) {
      const api = clubApi(club.league);
      const board = await fetchJson(`${api}/scoreboard`);
      const seasonYear = board.season?.year || new Date().getUTCFullYear();
      const start = new Date();
      const end = new Date(start.getTime() + 45 * 86400000);

      const [curData, prevData, boardData] = await Promise.all([
        fetchJson(`${api}/teams/${club.id}/schedule?season=${seasonYear}`).catch(() => ({events: []})),
        fetchJson(`${api}/teams/${club.id}/schedule?season=${seasonYear - 1}`).catch(() => ({events: []})),
        fetchJson(`${api}/scoreboard?dates=${ymd(start)}-${ymd(end)}`).catch(() => ({events: []})),
      ]);

      const fromBoard = (boardData.events || [])
        .filter(e => (e.competitions?.[0]?.competitors || []).some(c => String(c.team?.id) === club.id));
      const byId = new Map();
      for (const ev of [...(prevData.events || []), ...(curData.events || []), ...fromBoard]) {
        const m = parseMatch(ev, club.fallbackLink);
        if (m) byId.set(m.id, m);
      }
      const all = [...byId.values()].sort((a, b) => a.date - b.date);
      const now = Date.now();
      const last = [...all]
        .filter(m => m.finished || (m.home.score != null && m.date.getTime() <= now))
        .sort((a, b) => b.date - a.date)[0] || null;
      const live = all.find(m => m.live) || null;
      const next = live || all
        .filter(m => !m.finished && m.date.getTime() >= now - 3 * 3600000)
        .sort((a, b) => a.date - b.date)[0] || null;
      return {last, next};
    }

    async function loadClubFixtures() {
      await Promise.all(CLUBS.map(async club => {
        const lastEl = $(club.lastId);
        const nextEl = $(club.nextId);
        try {
          const {last, next} = await fetchClubMatches(club);
          renderMatchBlock(lastEl, last, 'last');
          renderMatchBlock(nextEl, next, 'next');
        } catch (err) {
          console.warn('club fixtures failed', club.id, err);
          lastEl.innerHTML = `<div class="mu-label">上场比分</div><div class="mu-empty">赛况获取失败</div><div class="mu-line"><span class="mu-line-tag">上场</span><span class="mu-line-meta">赛况获取失败</span></div>`;
          nextEl.innerHTML = `<div class="mu-label">下场预告</div><div class="mu-empty">赛况获取失败</div><div class="mu-line"><span class="mu-line-tag">下场</span><span class="mu-line-meta">赛况获取失败</span></div>`;
        }
      }));
    }

    loadClubFixtures();
    setInterval(loadClubFixtures, 15 * 60 * 1000);
  </script>
</body>
